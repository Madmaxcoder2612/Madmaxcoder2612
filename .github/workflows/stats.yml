name: Update stats image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api graphql -F login="${{ github.repository_owner }}" -f query="$(cat tools/query.graphql)" > data.json

      - name: Draw assets/stats.svg
        run: python3 tools/make_stats.py data.json assets/stats.svg

      - name: Commit if the image changed
        run: |
          rm data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Update stats image" && git push)
